name: Compile and Commit PDF

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.tex' # Only run if a .tex file anywhere in the project was modified
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Force Commit and Push PDF back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          # The -f flag forces Git to track the PDF, completely ignoring the .gitignore file
          git add -f main.pdf 
          git commit -m "chore: automated pdf compile [skip ci]" || echo "No changes to commit"
          git push
