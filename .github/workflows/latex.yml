name: Compile LaTeX Document

on:
  push:
    branches: [ "main", "master" ] # Runs every time you push to main or master

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex # Change this if your main file is named differently

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-PDF
          path: main.pdf # Uploads the freshly baked PDF directly to the cloud